name: multiome-pipeline
channels:
  - conda-forge
  - bioconda

dependencies:
  - python
  #- libblas=*=*openblas
  - websockets>=13.0 
  - pip
  # Core single-cell infrastructure (Move from pip to Conda)
  - scanpy>=1.10.0
  - anndata>=0.10.0
  - muon
  - decoupler>=1.5.0
  - cellbender
  - snapatac2>=2.10.0
  - mofapy2
  - pydeseq2
  - lamindb
  # Core scientific computing
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - wrapt
  # Single-cell analysis
  - igraph
  - leidenalg
#  - omicverse
  - cellbender
  # Image processing (Required by Scrublet for automatic thresholding)
  - scikit-image
  # Single-cell file formats and compression
  - h5py
  - numcodecs <0.16
  - pytables
  - openpyxl

  # Additional dependencies
  - scikit-learn
  - statsmodels
  - numba
  - umap-learn
  # Text adjustment for clean plots
  - adjusttext
  # HTTP library for web requests
  - requests
  - pertpy >=0.8.0   
    # R Core and Jupyter Integration (Required for %%R magic)
  - r-base
  - rpy2

  # R Packages from Conda-Forge & Bioconda
  - r-seurat
  - bioconductor-scater
  - bioconductor-scdblfinder
  - bioconductor-singlecellexperiment
  - bioconductor-biocparallel
  - bioconductor-scry
  - pip:
     #- pyscdblfinder
     - magic-impute