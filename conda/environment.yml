name: scanpy-pipeline
channels:
  - conda-forge
  - bioconda

dependencies:
  - python
  
  # Core scientific computing
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  
  # Single-cell analysis
  - scanpy
  - anndata
  - igraph
  - leidenalg
  - omicverse
  - decoupler >=1.5.0  
  - cellbender
  # Image processing (Required by Scrublet for automatic thresholding)
  - scikit-image
  # Single-cell file formats and compression
  - h5py
  - numcodecs <0.16
  - pytables
  - openpyxl

  # Additional dependencies
  - scikit-learn
  - statsmodels
  - numba
  - umap-learn
  # Text adjustment for clean plots
  - adjusttext
  # HTTP library for web requests
  - requests

    # R Core and Jupyter Integration (Required for %%R magic)
  - r-base
  - rpy2

  # R Packages from Conda-Forge & Bioconda
  - r-seurat
  - bioconductor-scater
  - bioconductor-scdblfinder
  - bioconductor-singlecellexperiment
  - bioconductor-biocparallel
  - bioconductor-scry
  - pip
  - pip:
      - lamindb[aws,bctrl]  # Data & workflow management (add extras like aws if needed)
      - pertpy >=0.8.0          # Perturbation analysis (loads scanpy/anndata-dependent tools)
      - pydeseq2